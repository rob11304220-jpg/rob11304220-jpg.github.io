<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="博客 — 文章列表" />
    <title>博客 — 个人主页</title>
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="logo" href="../index.html">站点标题</a>
        <button
          type="button"
          class="nav-toggle"
          aria-expanded="false"
          aria-controls="site-nav"
          id="nav-toggle"
        >
          <span class="nav-toggle__bar" aria-hidden="true"></span>
          <span class="nav-toggle__bar" aria-hidden="true"></span>
          <span class="nav-toggle__bar" aria-hidden="true"></span>
          <span class="visually-hidden">打开菜单</span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="站点导航">
          <ul class="site-nav__list">
            <li><a href="../index.html#about">关于</a></li>
            <li><a href="./" aria-current="page">博客</a></li>
            <li><a href="../index.html#projects">项目</a></li>
            <li><a href="../index.html#contact">联系</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="hero blog-hero" id="top" aria-labelledby="blog-title">
        <div class="hero__content">
          <p class="hero__eyebrow">写作与笔记</p>
          <h1 id="blog-title" class="hero__title">博客</h1>
          <p class="hero__lead">
            短文、折腾记录与想法。在 <code>blog/posts/</code> 下复制示例 HTML 即可新增一篇文章。
          </p>
        </div>
      </section>

      <section class="section section--alt" aria-labelledby="posts-title">
        <div class="section__inner">
          <h2 id="posts-title" class="section__title">文章</h2>
          <ul class="post-list">
            <li class="post-card">
              <time class="post-card__date" datetime="2026-05-08">2026 年 5 月 8 日</time>
              <h3 class="post-card__title">
                <a href="posts/hello.html">欢迎来到博客</a>
              </h3>
              <p class="post-card__excerpt">占位示例文章，展示正文排版与返回导航。</p>
              <a class="post-card__link" href="posts/hello.html">阅读全文</a>
            </li>
          </ul>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__copy">© <span id="year"></span> 你的名字。保留所有权利。</p>
      </div>
    </footer>

    <script src="../js/main.js" defer></script>
  </body>
</html>
